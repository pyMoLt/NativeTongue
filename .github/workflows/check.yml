name: NativeTongue checks
on:
  pull_request:
  push:
    branches: ["**"]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test --package-path HexCore
